<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathNet</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1c1f2a; --muted:#6b7080; --accent:#4f46e5; --border:#e3e5ee; --ok:#16a34a; --warn:#d97706; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12131a; --card:#1c1e28; --text:#e8e9ef; --muted:#9a9fb0; --accent:#818cf8; --border:#2c2f3d; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width:720px; margin:0 auto; padding:32px 16px; }
    h1 { font-size:1.6rem; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    form { display:flex; gap:8px; }
    input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
      background:var(--bg); color:var(--text); font:18px ui-monospace, Menlo, monospace; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; cursor:pointer; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .chip { background:transparent; color:var(--muted); border:1px solid var(--border); padding:4px 10px;
      font:13px ui-monospace, Menlo, monospace; border-radius:999px; }
    #result { margin-top:16px; }
    #result:empty { display:none; }
    .problem { color:var(--muted); font-size:.9rem; margin-bottom:8px; }
    ol { margin:0; padding-left:24px; font:18px/1.9 ui-monospace, Menlo, monospace; }
    li:last-child { font-weight:700; }
    .conf { margin-top:10px; font-size:.85rem; }
    .error { color:#dc2626; }
  </style>
</head>
<body>
<main>
  <h1>MathNet</h1>
  <p class="sub">Собственная нейросеть-трансформер (4.8M параметров), обученная с нуля решать задачи по шагам.</p>
  <div class="card">
    <form id="form">
      <input id="problem" autocomplete="off" placeholder="x^2-5x+6=0" required>
      <button>Решить</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>
  <div id="result" class="card"></div>
</main>
<script>
  const examples = ["x^2-5x+6=0", "3x+7=22", "47*36", "358+467", "(12+8)*3", "25% от 480", "(3x^3-2x^2+x-5)'", "84/7"];
  const input = document.getElementById("problem");
  const result = document.getElementById("result");
  const chips = document.getElementById("chips");
  for (const ex of examples) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = ex;
    b.onclick = () => { input.value = ex; solve(); };
    chips.appendChild(b);
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  async function solve() {
    result.replaceChildren(el("span", "problem", "Считаю…"));
    try {
      const res = await fetch("/api/solve", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ problem: input.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Ошибка сервера");
      const ol = el("ol");
      data.steps.forEach(s => ol.appendChild(el("li", "", s)));
      const pct = Math.round(data.confidence * 100);
      const conf = el("div", "conf", `Уверенность сети: ${pct}%`);
      conf.style.color = pct >= 80 ? "var(--ok)" : "var(--warn)";
      result.replaceChildren(el("div", "problem", "Задача: " + data.problem), ol, conf);
    } catch (err) {
      result.replaceChildren(el("p", "error", err.message));
    }
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); solve(); });
</script>
</body>
</html>
